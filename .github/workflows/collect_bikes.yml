name: Collect Dublin Bikes

on:
  schedule:
    # GitHub cron can be delayed or skipped.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Collect Dublin Bikes snapshot
        run: python collectors/bikes_collect.py
        env:
          BIKES_USER_AGENT: ${{ vars.BIKES_USER_AGENT }}

      - name: Commit and push snapshot
        run: |
          git config user.name "ca2-collector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bikes logs/bikes_collection_log.csv
          git diff --cached --quiet || git commit -m "data: bikes $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase || true
          git push
